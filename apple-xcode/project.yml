name: FinanceOS
options:
  bundleIdPrefix: com.financeos
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  FinanceOS:
    type: application
    platform: macOS
    sources:
      - path: MacViews
      - path: ../apple-adapter
      - path: Assets.xcassets
    dependencies:
      - framework: build/shared-framework/FinanceOSShared.framework
        embed: false
      - target: FinanceOSWidget
        embed: true
    entitlements:
      path: App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.com.financeos.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeos.mac
        INFOPLIST_FILE: AppInfo.plist
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        CURRENT_PROJECT_VERSION: "14"
        MARKETING_VERSION: "1.2.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -lc++ -lz"
  FinanceOSWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: ../apple-adapter
    dependencies:
      - framework: build/shared-framework/FinanceOSShared.framework
        embed: false
    entitlements:
      path: Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.financeos.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeos.mac.widget
        INFOPLIST_FILE: WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: Widget.entitlements
        CURRENT_PROJECT_VERSION: "14"
        MARKETING_VERSION: "1.2.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -lc++ -lz"
    preBuildScripts:
      - name: Build KMP shared framework
        script: |
          "$SRCROOT/build-shared-framework.sh"
        basedOnDependencyAnalysis: false
