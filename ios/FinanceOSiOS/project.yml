name: FinanceOSiOS
options:
  bundleIdPrefix: com.financeos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FinanceOSiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ExternalCore
      - path: Assets.xcassets
    dependencies:
      - target: FinanceOSiOSWidget
    entitlements:
      path: App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.financeos.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeos.ios
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        CURRENT_PROJECT_VERSION: "6"
        MARKETING_VERSION: "0.4.2"
        CODE_SIGN_STYLE: Automatic
  FinanceOSiOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ExternalWidgetSources
      - path: ExternalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeos.ios.widget
        INFOPLIST_FILE: ExternalWidgetSupport/Info.plist
        CODE_SIGN_ENTITLEMENTS: ExternalWidgetSupport/Widget.entitlements
        CURRENT_PROJECT_VERSION: "6"
        MARKETING_VERSION: "0.4.2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
