name: FinanceOSiOS
options:
  bundleIdPrefix: com.financeos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FinanceOSiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../apple-adapter
      - path: Assets.xcassets
    dependencies:
      - framework: build/shared-framework/FinanceOSShared.framework
      - target: FinanceOSiOSWidget
        embed: true
    entitlements:
      path: App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.financeos.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeos.ios
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        CURRENT_PROJECT_VERSION: "10"
        MARKETING_VERSION: "1.0.2"
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -lc++"
    preBuildScripts:
      - name: Build KMP shared framework
        script: |
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@21}"
          if [ -d "$SRCROOT/build/shared-framework/FinanceOSShared.framework" ] || [ -d "$SRCROOT/build/shared-framework-widget/FinanceOSShared.framework" ]; then
            exit 0
          fi
          cd "$SRCROOT/../.."
          CONFIGURATION_LOWER="$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
          if [[ "$SDK_NAME" == iphonesimulator* ]]; then
            TARGET_KIND="IosSimulatorArm64"
          else
            TARGET_KIND="IosArm64"
          fi
          ./gradlew ":shared:link${CONFIGURATION}Framework${TARGET_KIND}" -q
          rm -rf "$SRCROOT/build/shared-framework"
          mkdir -p "$SRCROOT/build/shared-framework"
          if [[ "$SDK_NAME" == iphonesimulator* ]]; then
            cp -R "shared/build/bin/iosSimulatorArm64/${CONFIGURATION_LOWER}Framework/FinanceOSShared.framework" "$SRCROOT/build/shared-framework/"
          else
            cp -R "shared/build/bin/iosArm64/${CONFIGURATION_LOWER}Framework/FinanceOSShared.framework" "$SRCROOT/build/shared-framework/"
          fi
        basedOnDependencyAnalysis: false
  FinanceOSiOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ExternalWidgetSources
      - path: ../../apple-adapter
    dependencies:
      - framework: build/shared-framework-widget/FinanceOSShared.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.financeos.ios.widget
        INFOPLIST_FILE: ExternalWidgetSupport/Info.plist
        CODE_SIGN_ENTITLEMENTS: ExternalWidgetSupport/Widget.entitlements
        CURRENT_PROJECT_VERSION: "10"
        MARKETING_VERSION: "1.0.2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -lc++"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/build/shared-framework-widget"
    preBuildScripts:
      - name: Build KMP shared framework
        script: |
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@21}"
          if [ -d "$SRCROOT/build/shared-framework-widget/FinanceOSShared.framework" ]; then
            exit 0
          fi
          cd "$SRCROOT/../.."
          CONFIGURATION_LOWER="$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
          if [[ "$SDK_NAME" == iphonesimulator* ]]; then
            TARGET_KIND="IosSimulatorArm64"
          else
            TARGET_KIND="IosArm64"
          fi
          ./gradlew ":shared:link${CONFIGURATION}Framework${TARGET_KIND}" -q
          rm -rf "$SRCROOT/build/shared-framework-widget"
          mkdir -p "$SRCROOT/build/shared-framework-widget"
          if [[ "$SDK_NAME" == iphonesimulator* ]]; then
            cp -R "shared/build/bin/iosSimulatorArm64/${CONFIGURATION_LOWER}Framework/FinanceOSShared.framework" "$SRCROOT/build/shared-framework/"
          else
            cp -R "shared/build/bin/iosArm64/${CONFIGURATION_LOWER}Framework/FinanceOSShared.framework" "$SRCROOT/build/shared-framework/"
          fi
        basedOnDependencyAnalysis: false
